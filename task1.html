<!DOCTYPE html>

<script>
    function calculateAge() {
        let dobValue = document.getElementById("dob").value;

        if (dobValue === "") {
            document.getElementById("age").value = "";
            document.getElementById("status").value = "";
            return;
        }

        let dob = new Date(dobValue);
        let today = new Date();

        let age = today.getFullYear() - dob.getFullYear();
        let month = today.getMonth() - dob.getMonth();

        if (
            month < 0 ||
            (month === 0 && today.getDate() < dob.getDate())
        ) {
            age--;
        }

        document.getElementById("age").value = age;

        if (age >= 13 && age <= 19) {
            document.getElementById("status").value = "Teenager";
        }
        else if (age >= 18) {
            document.getElementById("status").value = "Eligible to Vote";
        }
        else {
            document.getElementById("status").value =
                "Not a teenager / Not eligible to vote";
        }
    }


    function validateForm() {

        let firstName =
            document.getElementById("firstName").value.trim();

        let lastName =
            document.getElementById("lastName").value.trim();

        let fatherName =
            document.getElementById("fatherName").value.trim();

        let gender =
            document.querySelector('input[name="gender"]:checked');

        let dob =
            document.getElementById("dob").value;

        let email =
            document.getElementById("email").value.trim();

        let permanentAddress =
            document.getElementById("permanentAddress").value.trim();

        let phone =
            document.getElementById("phone").value.trim();


        /* Clear previous errors */

        document.getElementById("firstNameError").innerHTML = "";
        document.getElementById("lastNameError").innerHTML = "";
        document.getElementById("fatherNameError").innerHTML = "";
        document.getElementById("genderError").innerHTML = "";
        document.getElementById("dobError").innerHTML = "";
        document.getElementById("emailError").innerHTML = "";
        document.getElementById("phoneError").innerHTML = "";
        document.getElementById("permanentAddressError").innerHTML = "";


        let valid = true;


        /* First Name */

        if (firstName === "") {

            document.getElementById("firstNameError").innerHTML =
                "First name is required";

            valid = false;
        }


        /* Last Name */

        if (lastName === "") {

            document.getElementById("lastNameError").innerHTML =
                "Last name is required";

            valid = false;
        }


        /* Father Name */

        if (fatherName === "") {

            document.getElementById("fatherNameError").innerHTML =
                "Father name is required";

            valid = false;
        }


        /* Gender */

        if (!gender) {

            document.getElementById("genderError").innerHTML =
                "Please select gender";

            valid = false;
        }


        /* Date of Birth */

        if (dob === "") {

            document.getElementById("dobError").innerHTML =
                "Date of birth is required";

            valid = false;
        }


        /* Email */

        let emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {

            document.getElementById("emailError").innerHTML =
                "Email is required";

            valid = false;
        }

        else if (!emailPattern.test(email)) {

            document.getElementById("emailError").innerHTML =
                "Invalid email address";

            valid = false;
        }


        /* Phone Number */

        let phonePattern = /^[0-9]{10}$/;

        if (phone === "") {

            document.getElementById("phoneError").innerHTML =
                "Phone number is required";

            valid = false;
        }

        else if (!phonePattern.test(phone)) {

            document.getElementById("phoneError").innerHTML =
                "Phone number must contain exactly 10 digits";

            valid = false;
        }


        /* Permanent Address */

        if (permanentAddress === "") {

            document.getElementById("permanentAddressError").innerHTML =
                "Permanent address is required";

            valid = false;
        }


        /* Final Result */

        if (valid) {

    let form = document.getElementById("studentForm");

    let formData = new FormData(form);

    console.log("Student Form Data:");

    for (let [key, value] of formData.entries()) {

        console.log(key + ":", value);

    }

    alert("Registration successful!");
}
    }
</script>
